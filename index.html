<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><link rel="manifest" href="./manifest.webmanifest"><title>Nexo TV · VIDAA experimental</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#f3f8fa;background:linear-gradient(135deg,#193833,#101923 60%);font-family:Arial,sans-serif}main{max-width:1500px;margin:auto;padding:4vh 5vw}.top{display:flex;justify-content:space-between}.brand{font-size:23px;letter-spacing:3px;font-weight:bold;color:#9fe5c6}.time{text-align:right;font-size:36px;font-weight:bold}.date{font-size:16px;color:#b0c9ca}.hero{margin:7vh 0 5vh}h1{font-size:clamp(40px,5vw,77px);letter-spacing:-2px;margin:10px 0}.sub{color:#b8c8cf;font-size:21px}.eyebrow{color:#9fe5c6;letter-spacing:3px;font-size:17px}.section{font-size:21px;margin-bottom:18px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.tile{min-height:165px;border:2px solid #31444e;border-radius:18px;color:white;background:#24353d;padding:24px;text-align:left;cursor:pointer;font:inherit}.icon{display:block;font-size:36px;margin-bottom:28px}.name{font-size:26px;font-weight:bold}.btn{font:inherit;font-size:19px;background:#24353d;color:#fff;border:2px solid #425963;border-radius:12px;padding:15px 24px;margin:26px 10px 0 0;cursor:pointer}.tile:focus,.tile:hover,.btn:focus,.btn:hover,.opt:focus{border-color:#b3ffdd;outline:3px solid #81ad9b;background:#31554b}.foot{color:#b3bec4;margin-top:24px;font-size:16px}.overlay{position:fixed;inset:0;background:#101923f7;display:none;overflow:auto;padding:5vh 8vw}.overlay.open{display:block}.overlay h2{font-size:38px}.overlay p{font-size:20px;color:#b8c8cf;line-height:1.5}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:18px;text-align:left;border:2px solid #456;border-radius:12px;background:#22323b;color:white;font:inherit;font-size:20px}.diag{font:16px/1.6 Consolas,monospace;white-space:pre-wrap;word-break:break-word;border:1px solid #345;background:#0c151a;padding:20px;border-radius:12px}.toast{display:none;position:fixed;bottom:25px;left:10%;width:80%;padding:18px;background:#234b41;border-radius:12px;text-align:center;font-size:19px}.toast.visible{display:block}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:120px}.icon{margin-bottom:10px}.options{grid-template-columns:1fr}}
</style></head><body><main><header class="top"><div><div class="brand">NEXO TV <small style="font-size:13px;color:#bdd;letter-spacing:0">BETA</small></div><div class="date">Inicio ligero y sin anuncios</div></div><div class="time"><span id="hour">--:--</span><div class="date" id="date">&nbsp;</div></div></header><section class="hero"><div class="eyebrow">TU TELEVISIÓN, A TU MANERA</div><h1>¿Qué quieres ver?</h1><div class="sub">Solo tus aplicaciones. Sin publicidad ni recomendaciones.</div></section><section><div class="section">Tus aplicaciones</div><div class="grid" id="apps"></div></section><nav><button class="btn" data-nav="settings">⚙ Personalizar</button><button class="btn" data-nav="diag">⌁ Diagnóstico</button><button class="btn" data-nav="about">ⓘ Acerca de</button></nav><div class="foot">Prototipo experimental · Las aplicaciones nativas pueden requerir funciones de VIDAA aún no verificadas.</div></main><div id="overlay" class="overlay" role="dialog"><div id="content"></div><button class="btn" data-nav="close">← Volver</button></div><div id="toast" class="toast"></div>
<script>
(function(){'use strict';
var C=[['netflix','Netflix','Netflix','N','#371b22'],['youtube','YouTube','YouTube','▶','#3b2022'],['prime','Prime Video','Amazon','p','#123544'],['plex','Plex','Plex','▷','#403322'],['disney','Disney+','Disney+','✦','#172d46'],['rtve','RTVE Play','RTVE Play','◈','#214336'],['filmin','Filmin','Filmin','f','#342443'],['dazn','DAZN','DAZN','D','#2b2c35']];
var favorites=['netflix','youtube','prime','plex'];try{var s=JSON.parse(localStorage.getItem('nexo-pins'));if(s&&s.length)favorites=s;}catch(e){}
var overlay=document.getElementById('overlay'),content=document.getElementById('content'),toast=document.getElementById('toast'),previous;
function note(t){toast.textContent=t;toast.className='toast visible';setTimeout(function(){toast.className='toast';},5000);}
function render(){var root=document.getElementById('apps');root.innerHTML='';favorites.forEach(function(id){var a=C.filter(function(x){return x[0]===id;})[0];if(!a)return;var b=document.createElement('button');b.className='tile';b.style.background='linear-gradient(135deg,'+a[4]+',#24353d)';b.setAttribute('data-app',id);var ico=document.createElement('span');ico.className='icon';ico.textContent=a[3];var name=document.createElement('span');name.className='name';name.textContent=a[1];b.appendChild(ico);b.appendChild(name);root.appendChild(b);});}
function launch(id){var a=C.filter(function(x){return x[0]===id;})[0];if(!a)return;if(typeof window.Hisense_launchAppViaName==='function'){try{window.Hisense_launchAppViaName(a[2]);note('Solicitud enviada a VIDAA: '+a[1]+'. Comprueba si abre.');}catch(e){note('La API dio error: '+String(e.message||e));}}else note('Esta app no dispone de Hisense_launchAppViaName. Mira Diagnóstico.');}
function panel(kind){previous=document.activeElement;overlay.className='overlay open';content.innerHTML='';var h=document.createElement('h2');h.textContent=kind==='settings'?'Personalizar':kind==='diag'?'Diagnóstico VIDAA':'Nexo TV 0.1';content.appendChild(h);var p=document.createElement('p');p.textContent=kind==='settings'?'Selecciona las apps que deseas mostrar. Tus cambios se guardan en el almacenamiento del navegador de la TV.':kind==='diag'?'Prueba de solo lectura: no se envía nada ni se modifica el firmware. Fotografía los resultados si quieres compartirlos.':'Interfaz experimental sin recursos externos. La caché local y la apertura de apps necesitan comprobarse en VIDAA 9. El botón Home original no se puede sustituir desde este prototipo.';content.appendChild(p);
if(kind==='settings'){var div=document.createElement('div');div.className='options';C.forEach(function(a){var b=document.createElement('button');b.className='opt';b.setAttribute('data-toggle',a[0]);b.textContent=(favorites.indexOf(a[0])>=0?'✓ ':'○ ')+a[1];div.appendChild(b);});content.appendChild(div);}
if(kind==='diag'){var keys=['Hisense_launchAppViaName','Hisense_launchAppViaUri','Hisense_StartApp','Hisense_GetFirmWareVersion','HiUtils_createRequest'];var lines=['URL: '+location.href,'Online (estimación): '+navigator.onLine,'Service Worker disponible: '+('serviceWorker' in navigator),'SW controla la página: '+!!(navigator.serviceWorker&&navigator.serviceWorker.controller),'CacheStorage disponible: '+('caches' in window),'LocalStorage accesible: '+checkStore(),'','Funciones de VIDAA:'];keys.forEach(function(k){lines.push('  '+k+' = '+typeof window[k]);});var pre=document.createElement('pre');pre.className='diag';pre.textContent=lines.join('\n');content.appendChild(pre);var b=document.createElement('button');b.className='btn';b.textContent='Actualizar diagnóstico';b.setAttribute('data-nav','diag');content.appendChild(b);}
overlay.querySelector('[data-nav="close"]').focus();}
function checkStore(){try{localStorage.setItem('nexo-check','ok');var ok=localStorage.getItem('nexo-check')==='ok';localStorage.removeItem('nexo-check');return ok;}catch(e){return false;}}
function close(){overlay.className='overlay';if(previous&&previous.focus)previous.focus();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var id=b.getAttribute('data-app');if(id){launch(id);return;}var tog=b.getAttribute('data-toggle');if(tog){if(favorites.indexOf(tog)>=0){if(favorites.length===1){note('Debes mantener al menos una aplicación.');return;}favorites=favorites.filter(function(x){return x!==tog;});}else favorites.push(tog);try{localStorage.setItem('nexo-pins',JSON.stringify(favorites));}catch(e){note('No se han podido guardar los ajustes');}render();panel('settings');return;}var action=b.getAttribute('data-nav');if(action==='close')close();else if(action)panel(action);});
function arrow(dir){var root=overlay.classList.contains('open')?overlay:document.querySelector('main');var bs=Array.prototype.slice.call(root.querySelectorAll('button'));if(!bs.length)return;var now=document.activeElement;if(bs.indexOf(now)<0){bs[0].focus();return;}var r=now.getBoundingClientRect(),x=(r.left+r.right)/2,y=(r.top+r.bottom)/2,selected=null,best=1e10;bs.forEach(function(el){if(el===now)return;var z=el.getBoundingClientRect(),dx=(z.left+z.right)/2-x,dy=(z.top+z.bottom)/2-y;if(dir==='left'&&dx>=-5||dir==='right'&&dx<=5||dir==='up'&&dy>=-5||dir==='down'&&dy<=5)return;var score=dir==='left'||dir==='right'?Math.abs(dx)+2.5*Math.abs(dy):Math.abs(dy)+2.5*Math.abs(dx);if(score<best){best=score;selected=el;}});if(selected)selected.focus();}
document.addEventListener('keydown',function(e){var k=e.keyCode||e.which,dirs={37:'left',38:'up',39:'right',40:'down'};if(dirs[k]){e.preventDefault();arrow(dirs[k]);}else if(k===8||k===27||k===461){e.preventDefault();if(overlay.classList.contains('open'))close();else try{window.close();}catch(e){}}else if(k===13&&document.activeElement&&document.activeElement.tagName==='BUTTON'){e.preventDefault();document.activeElement.click();}});
function updateTime(){var d=new Date();document.getElementById('hour').textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}render();updateTime();setInterval(updateTime,30000);
if('serviceWorker' in navigator&&window.isSecureContext){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('Service Worker no disponible en VIDAA',e);});});}
})();
</script></body></html>
